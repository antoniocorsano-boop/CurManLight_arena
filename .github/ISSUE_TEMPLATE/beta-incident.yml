name: Beta incident
description: Report a problem observed in the CurManLight Arena Beta without sharing personal or secret data.
title: "[BETA] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for CurManLight Arena Beta incidents. Do not include student personal data, passwords, tokens, private keys or other secrets.
  - type: input
    id: release
    attributes:
      label: Release SHA
      description: Copy the SHA from beta-release.json when available.
      placeholder: 40-character Git SHA
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks the task
        - Task can continue with workaround
        - Minor usability problem
        - Visual/cosmetic problem
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Describe the human task, not implementation details.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Could you recover?
      description: Explain whether retry, reload, back navigation or another visible recovery path worked.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include student personal data, credentials, tokens or secrets.
          required: true
