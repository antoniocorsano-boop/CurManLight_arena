name: CML Google Drive Outbound Backup

on:
  push:
    branches:
      - feature/google-drive-outbound-backup
      - feature/google-drive-backup-action
  pull_request:
    paths:
      - 'src/domain/backup/**'
      - 'src/infrastructure/googleDrive/**'
      - 'src/features/documents/lib/localSourceRegistryBackup.ts'
      - 'src/features/documents/components/SourceRegistryDriveBackupAction.tsx'
      - 'src/features/session/components/AppViewsLayer.tsx'
      - 'src/__tests__/google-drive-backup-sink.test.ts'
      - 'src/__tests__/google-drive-backup-action.test.ts'
      - 'src/__tests__/local-source-registry-backup.browser.test.ts'
      - 'src/__tests__/source-registry-drive-boundary.test.ts'
      - 'docs/architecture/ARENA_GOOGLE_DRIVE_OUTBOUND_BACKUP.md'
      - 'docs/architecture/ARENA_GOOGLE_DRIVE_BACKUP_ACTION.md'
      - '.github/workflows/google-drive-outbound-backup.yml'

permissions:
  contents: read

jobs:
  outbound-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backup boundary, Drive adapter and explicit action tests
        run: >-
          npx vitest run --project unit
          src/__tests__/source-registry-drive-boundary.test.ts
          src/__tests__/google-drive-backup-sink.test.ts
          src/__tests__/google-drive-backup-action.test.ts

      - name: Install Chromium for exact local registry snapshot verification
        run: npx playwright install --with-deps chromium

      - name: Local source registry backup browser pipeline
        run: npx vitest run --project indexeddb-browser src/__tests__/local-source-registry-backup.browser.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
