name: Beta HIA Evidence

on:
  pull_request:
    paths:
      - '.human/**'
      - 'src/features/curriculum/components/RevisioneTab.tsx'
      - 'src/features/session/components/DashboardView.tsx'
      - 'src/features/session/components/HomeRoleOverview.tsx'
      - 'src/features/session/communication/**'
      - 'src/features/beta/**'
      - 'src/domain/revision/**'
      - 'src/domain/transfer/**'
      - 'src/domain/human-communication/**'
      - 'src/__tests__/human-communication-model.test.ts'
      - 'src/__tests__/home-human-communication.test.ts'
      - 'tools/human-communication-model/**'
      - 'agent_skills/human-communication-model/**'
      - 'scripts/capture-beta-g5-hia.cjs'
      - 'scripts/capture-beta-home-hcm.cjs'
      - 'scripts/serve-beta-pages-preview.cjs'
      - 'docs/architecture/CML_ARENA_BETA_B3_ACCEPTANCE_v1.json'
      - 'docs/evidence/B3_G5_HIA_ACCEPTANCE_2026-08-27.json'
      - 'docs/04_product_experience/HUMAN_COMMUNICATION_MODEL.md'
      - '.github/workflows/beta-hia-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-hia-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Human Interaction Model
        run: node tools/human-interaction-model/validate.mjs .

      - name: Validate Human Communication Model
        run: node tools/human-communication-model/validate.mjs .

      - name: Validate critical Beta contracts
        run: >-
          npx vitest run
          src/__tests__/human-communication-model.test.ts
          src/__tests__/home-human-communication.test.ts
          src/__tests__/beta-explicit-decision-outcome-contract.test.ts
          src/__tests__/beta-planning-handoff-preview.test.ts
          src/__tests__/beta-revision-routing-contract.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build Beta artifact
        run: npm run build:beta

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture bounded desktop and mobile HIA evidence
        env:
          BETA_BASE_URL: http://127.0.0.1:4173/CurManLight_arena
          HIA_OUTPUT_DIR: artifacts/hia
        run: |
          set -euo pipefail
          node scripts/serve-beta-pages-preview.cjs > /tmp/cml-beta-hia-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; cat /tmp/cml-beta-hia-preview.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/CurManLight_arena/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/CurManLight_arena/ > /dev/null
          node scripts/capture-beta-home-hcm.cjs
          node scripts/capture-beta-g5-hia.cjs

      - name: Upload HIA evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-g5-hia-evidence-${{ github.sha }}
          path: artifacts/hia
          if-no-files-found: error
          retention-days: 7
