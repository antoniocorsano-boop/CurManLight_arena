name: Assemble Canonical Curricolo Artifact

on:
  push:
    branches:
      - feat/curricolo-verticale-release-v1
    paths:
      - '.tmp/curricolo-artifact/**'

permissions:
  contents: write

concurrency:
  group: assemble-canonical-curricolo-artifact
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/curricolo-verticale-release-v1
          fetch-depth: 0

      - name: Assemble source only when all fragments exist
        id: source
        shell: bash
        run: |
          set -euo pipefail
          for index in 00 01 02 03; do
            test -f ".tmp/curricolo-artifact/part-${index}.b64" || {
              echo "ARTIFACT_SOURCE_WAITING part-${index}.b64"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
          done

          cat .tmp/curricolo-artifact/part-*.b64 > /tmp/canonical-curricolo-source.gz.b64
          base64 --decode /tmp/canonical-curricolo-source.gz.b64 > /tmp/canonical-curricolo-source.txt.gz
          gzip --decompress --stdout /tmp/canonical-curricolo-source.txt.gz > /tmp/canonical-curricolo-source.txt
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.source.outputs.ready == 'true'
        run: npm ci

      - name: Materialize revision 27 with qualified generator
        if: steps.source.outputs.ready == 'true'
        run: |
          node scripts/materialize-canonical-curricolo-v1.mjs \
            --input /tmp/canonical-curricolo-source.txt \
            --revision-id 27 \
            --output src/features/curriculum/data/canonicalCurricoloV13.generated.json

      - name: Validate generated artifact
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src/features/curriculum/data/canonicalCurricoloV13.generated.json';
          const artifact = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (artifact.schemaVersion !== 'ARENA_CANONICAL_CURRICOLO_ARTIFACT_V1') throw new Error('schema mismatch');
          if (artifact.source?.revisionId !== '27') throw new Error('revision mismatch');
          if (artifact.source?.sourceContentFootprint?.hash !== '99c4ccc3') throw new Error('source footprint mismatch');
          if (artifact.materialization?.segments?.length !== 113) throw new Error('segment count mismatch');
          if (artifact.materialization?.perimeter?.expected?.length !== 113) throw new Error('perimeter count mismatch');
          if (JSON.stringify(artifact).includes('computedAt')) throw new Error('computedAt forbidden');

          const infancy = artifact.materialization.segments.find(item => item.id === 'can-curr-master-00-infanzia-i-discorsi-e-le-parole');
          if (!infancy) throw new Error('infancy segment missing');
          if (JSON.stringify(infancy.content?.competenze ?? []).includes('3 anni —')) throw new Error('infancy competence boundary leak');

          const latinIII = artifact.materialization.segments.find(item => item.id === 'can-curr-master-00-secondaria-latino-lel-3');
          if (!latinIII) throw new Error('latin III segment missing');
          if (JSON.stringify(latinIII.content?.evidenze ?? []).includes('Stato curricolare')) throw new Error('latin record boundary leak');

          console.log(`CANONICAL_CURRICOLO_ARTIFACT_GENERATION_PASS artifact=${artifact.artifactFootprint?.hash}`);
          NODE

      - name: Commit generated artifact and remove source fragments
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/curriculum/data/canonicalCurricoloV13.generated.json
          git rm -r .tmp/curricolo-artifact
          if git diff --cached --quiet; then
            echo 'CANONICAL_CURRICOLO_ARTIFACT_NO_CHANGE'
            exit 0
          fi
          git commit -m 'feat(arena): regenerate canonical curricolo revision 27'
          git push origin HEAD:feat/curricolo-verticale-release-v1
