name: Align Canonical Curricolo Artifact Boundaries

on:
  push:
    branches:
      - feat/curricolo-verticale-release-v1
    paths:
      - '.github/workflows/assemble-canonical-curricolo-artifact.yml'

permissions:
  contents: write

concurrency:
  group: align-canonical-curricolo-artifact-boundaries
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/curricolo-verticale-release-v1
          fetch-depth: 0

      - name: Apply exact parser-boundary delta and recompute footprint
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src/features/curriculum/data/canonicalCurricoloV13.generated.json';
          const artifact = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (artifact.schemaVersion !== 'ARENA_CANONICAL_CURRICOLO_ARTIFACT_V1') throw new Error('schema mismatch');
          if (artifact.source?.revisionId !== '27') throw new Error('revision mismatch');
          if (artifact.source?.sourceContentFootprint?.hash !== '99c4ccc3') throw new Error('source footprint mismatch');
          if (artifact.artifactFootprint?.hash !== '5157a7c4') throw new Error(`unexpected pre-alignment artifact ${artifact.artifactFootprint?.hash}`);
          if (artifact.materialization?.segments?.length !== 113) throw new Error('segment count mismatch');
          if (artifact.materialization?.perimeter?.expected?.length !== 113) throw new Error('perimeter count mismatch');

          const segmentById = new Map(artifact.materialization.segments.map(item => [item.id, item]));
          const nodeById = new Map(artifact.materialization.nodes.map(item => [item.id, item]));
          let changed = 0;

          const infancyIds = [
            'can-curr-master-00-infanzia-i-discorsi-e-le-parole',
            'can-curr-master-00-infanzia-il-se-e-l-altro',
            'can-curr-master-00-infanzia-la-conoscenza-del-mondo',
            'can-curr-master-00-infanzia-immagini-suoni-colori',
            'can-curr-master-00-infanzia-il-corpo-e-il-movimento',
          ];

          for (const id of infancyIds) {
            const segment = segmentById.get(id);
            if (!segment || !Array.isArray(segment.content?.competenze) || segment.content.competenze.length !== 1) {
              throw new Error(`unexpected infancy competence shape for ${id}`);
            }
            const before = segment.content.competenze[0];
            if (typeof before !== 'string' || !before.endsWith('3 anni —')) {
              throw new Error(`expected pre-alignment infancy boundary leak for ${id}`);
            }
            const after = before.replace(/\s*3 anni —$/u, '').trim().replace(/[.;]\s*$/u, '').trim();
            if (!after || after === before) throw new Error(`infancy alignment produced no change for ${id}`);
            segment.content.competenze[0] = after;
            changed += 1;

            const node = nodeById.get(`${id}-competence-1`);
            if (!node || node.title !== before) throw new Error(`infancy competence node mismatch for ${id}`);
            node.title = after;
            changed += 1;
          }

          const latinId = 'can-curr-master-00-secondaria-latino-lel-3';
          const latin = segmentById.get(latinId);
          if (!latin || !Array.isArray(latin.content?.evidenze) || latin.content.evidenze.length !== 1) {
            throw new Error('unexpected Latin III evidence shape');
          }
          const latinBefore = latin.content.evidenze[0];
          if (typeof latinBefore !== 'string' || !latinBefore.includes('Stato curricolare:')) {
            throw new Error('expected pre-alignment Latin III boundary leak');
          }
          const latinAfter = latinBefore.split('Stato curricolare:')[0].trim().replace(/[.;]\s*$/u, '').trim();
          if (!latinAfter || latinAfter === latinBefore) throw new Error('Latin III alignment produced no change');
          latin.content.evidenze[0] = latinAfter;
          changed += 1;

          const latinNode = nodeById.get(`${latinId}-evidence-1`);
          if (!latinNode || latinNode.title !== latinBefore) throw new Error('Latin III evidence node mismatch');
          latinNode.title = latinAfter;
          changed += 1;

          if (changed !== 12) throw new Error(`expected exactly 12 derived-value changes, got ${changed}`);

          function canonicalize(value) {
            if (value === undefined) throw new Error('cannot canonicalize undefined');
            if (value === null || typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return value;
            if (Array.isArray(value)) return value.map(canonicalize);
            if (typeof value === 'object') {
              const sorted = {};
              for (const key of Object.keys(value).sort()) sorted[key] = canonicalize(value[key]);
              return sorted;
            }
            throw new Error(`cannot canonicalize ${typeof value}`);
          }
          function canonicalSerialize(value) {
            return JSON.stringify(canonicalize(value));
          }
          function fnv1a(str) {
            let hash = 0x811c9dc5;
            for (let i = 0; i < str.length; i += 1) {
              hash ^= str.charCodeAt(i);
              hash = Math.imul(hash, 0x01000193);
            }
            return (hash >>> 0).toString(16).padStart(8, '0');
          }

          const { artifactFootprint: _oldFootprint, ...base } = artifact;
          const newHash = fnv1a(canonicalSerialize(base));
          artifact.artifactFootprint = { algorithm: 'fnv1a', version: 1, hash: newHash };

          if (JSON.stringify(artifact).includes('computedAt')) throw new Error('computedAt forbidden');
          if (JSON.stringify(segmentById.get(infancyIds[0]).content.competenze).includes('3 anni —')) throw new Error('infancy boundary still present');
          if (JSON.stringify(latin.content.evidenze).includes('Stato curricolare')) throw new Error('Latin III boundary still present');

          fs.writeFileSync(path, canonicalSerialize(artifact), 'utf8');
          console.log(`CANONICAL_CURRICOLO_BOUNDARY_ALIGNMENT_PASS artifact=${newHash} changes=${changed}`);
          NODE

      - name: Commit aligned generated artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/curriculum/data/canonicalCurricoloV13.generated.json
          git diff --cached --quiet && { echo 'BOUNDARY_ALIGNMENT_NO_CHANGE'; exit 1; }
          git commit -m 'fix(arena): align generated curricolo record boundaries'
          git push origin HEAD:feat/curricolo-verticale-release-v1
