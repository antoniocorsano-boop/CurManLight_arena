name: Apply PR198 Storage Fix

on:
  push:
    branches:
      - ops/pr198-storage-fix

permissions:
  contents: write

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR #198 branch
        uses: actions/checkout@v4
        with:
          ref: feature/team-meeting-workspace
          fetch-depth: 0

      - name: Connect runtime Dexie fallback to storage health
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/store/useCurriculumStore.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              """type PersistedStateRecord = {\n  key: string;\n  value: string;\n};\n\nlet db: Dexie | null = null;""",
              """type PersistedStateRecord = {\n  key: string;\n  value: string;\n};\n\nfunction markStorageVolatile(reason: unknown) {\n  if (typeof window === 'undefined') return;\n  (window as Window & { __curmanStorageVolatile?: boolean }).__curmanStorageVolatile = true;\n  window.dispatchEvent(new CustomEvent('arena:storage-volatile', {\n    detail: { reason: reason instanceof Error ? reason.message : String(reason) },\n  }));\n}\n\nlet db: Dexie | null = null;""",
              'insert runtime storage marker',
          )

          replacements = [
              (
                  '  console.warn("[CurManLight Storage Guard] Impossibile configurare Dexie/IndexedDB:", e);',
                  '  markStorageVolatile(e);\n  console.warn("[CurManLight Storage Guard] Impossibile configurare Dexie/IndexedDB:", e);',
                  'Dexie setup fallback',
              ),
              (
                  '      console.warn("[CurManLight Storage Guard] Impossibile leggere da IndexedDB, uso la memoria temporanea:", e);',
                  '      markStorageVolatile(e);\n      console.warn("[CurManLight Storage Guard] Impossibile leggere da IndexedDB, uso la memoria temporanea:", e);',
                  'IndexedDB read fallback',
              ),
              (
                  '      console.warn("[CurManLight Storage Guard] Impossibile scrivere in IndexedDB, uso la memoria temporanea:", e);',
                  '      markStorageVolatile(e);\n      console.warn("[CurManLight Storage Guard] Impossibile scrivere in IndexedDB, uso la memoria temporanea:", e);',
                  'IndexedDB write fallback',
              ),
              (
                  '      console.warn("[CurManLight Storage Guard] Impossibile eliminare da IndexedDB, uso la memoria temporanea:", e);',
                  '      markStorageVolatile(e);\n      console.warn("[CurManLight Storage Guard] Impossibile eliminare da IndexedDB, uso la memoria temporanea:", e);',
                  'IndexedDB delete fallback',
              ),
          ]

          for old, new, label in replacements:
              replace_once(old, new, label)

          path.write_text(text, encoding='utf-8')

      - name: Check patch
        run: git diff --check && git diff -- src/store/useCurriculumStore.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Storage contract tests
        run: npx vitest run src/__tests__/storage-runtime-health.test.ts

      - name: IndexedDB browser tests
        run: npm run test:browser

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit validated storage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useCurriculumStore.ts
          git commit -m "fix(storage): surface runtime IndexedDB fallback"
          git push origin HEAD:feature/team-meeting-workspace
