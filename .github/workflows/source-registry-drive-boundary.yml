name: CML Source Registry Drive Boundary

on:
  push:
    branches:
      - feature/source-registry-drive-boundary
  pull_request:
    paths:
      - 'src/domain/curriculum/sources/**'
      - 'src/domain/backup/**'
      - 'src/__tests__/source-registry-drive-boundary.test.ts'
      - 'docs/architecture/CML_DRIVE_SOURCE_BOUNDARY.md'
      - '.github/workflows/source-registry-drive-boundary.yml'

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Source and Drive contract tests
        run: npx vitest run src/__tests__/source-registry-drive-boundary.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
