name: Arena Atlas Curriculum Export

on:
  pull_request:
    paths:
      - "exports/atlas-curriculum/**"
      - "scripts/validate-atlas-curriculum-export.mjs"
      - "docs/architecture/ARENA_ATLAS_CURRICULUM_SYNC_V1.md"
      - ".github/workflows/arena-atlas-curriculum-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Atlas curriculum export
        run: node scripts/validate-atlas-curriculum-export.mjs
