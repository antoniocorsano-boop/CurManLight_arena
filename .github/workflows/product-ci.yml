name: CurManLight Product CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fast regression tests
        run: npm run test:fast

      - name: Human governance tests
        run: >-
          npx vitest run --project unit
          src/__tests__/human-task-cognitive-gate.test.ts
          src/__tests__/revision-human-task.test.ts
          src/__tests__/institution-capabilities.test.ts
          src/__tests__/supabase-workspace-foundation.test.ts
          src/__tests__/home-human-communication.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
