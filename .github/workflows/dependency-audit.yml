name: Dependency Security Audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect runtime dependency audit
        run: npm audit --omit=dev --json > runtime-audit.json || true

      - name: Collect full dependency audit
        run: npm audit --json > full-audit.json || true

      - name: Summarize audit evidence
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [['RUNTIME', 'runtime-audit.json'], ['FULL', 'full-audit.json']]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const counts = report.metadata?.vulnerabilities || {};
            console.log(`=== ${label}_DEPENDENCY_AUDIT ===`);
            console.log(`COUNTS ${JSON.stringify(counts)}`);
            const vulnerabilities = Object.values(report.vulnerabilities || {}).sort((a, b) => {
              const order = { critical: 4, high: 3, moderate: 2, low: 1, info: 0 };
              return (order[b.severity] || 0) - (order[a.severity] || 0) || a.name.localeCompare(b.name);
            });
            if (vulnerabilities.length === 0) console.log('NO_VULNERABILITIES');
            for (const vuln of vulnerabilities) {
              const advisories = (vuln.via || [])
                .filter((item) => typeof item === 'object')
                .map((item) => ({
                  source: item.source,
                  name: item.name,
                  title: item.title,
                  url: item.url,
                  severity: item.severity,
                  range: item.range,
                  cvss: item.cvss,
                  cwe: item.cwe,
                }));
              console.log(JSON.stringify({
                package: vuln.name,
                severity: vuln.severity,
                direct: vuln.isDirect,
                range: vuln.range,
                effects: vuln.effects,
                viaPackages: (vuln.via || []).filter((item) => typeof item === 'string'),
                advisories,
                fixAvailable: vuln.fixAvailable,
              }));
            }
          }
          NODE

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-security-audit
          path: |
            runtime-audit.json
            full-audit.json
          if-no-files-found: error

      - name: Non-claim
        if: always()
        run: echo 'Dependency audit collected evidence only; remediation and promotion require separate review and existing Arena gates.'
