# final bounded patch: typed routing + Beta revision journey binding
name: B3 Apply Revision Journey Patch

on:
  push:
    branches:
      - beta/b3-g4-revision-journey
    paths:
      - '.github/workflows/b3-apply-revision-journey-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/b3-g4-revision-journey
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply minimal route and view bindings
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, label: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected anchor: {label}')
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'src/App.tsx',
              "import { AppHeader, AppSidebar, GlobalAlerts, MobileBottomNav, type AppTab } from './features/navigation';",
              "import { AppHeader, AppSidebar, GlobalAlerts, MobileBottomNav, appTabToPath, pathnameToAppTab, type AppTab } from './features/navigation';",
              'navigation routing import',
          )

          replace_exact(
              'src/App.tsx',
              " const pathnameToTab = (pathname: string): AppTab => {\n  if (pathname.startsWith('/curriculum') || pathname.startsWith('/revisione')) return 'curricolo';\n  if (pathname.startsWith('/classroom')) return 'progetta-annuale';\n  if (pathname.startsWith('/planning')) return 'progetta-annuale';\n  if (pathname.startsWith('/documents')) return 'esportazioni';\n  if (pathname.startsWith('/copilot')) return 'dashboard';\n  if (pathname.startsWith('/knowledge') || pathname.startsWith('/second-brain')) return 'second-brain';\n  if (pathname.startsWith('/social')) return 'dashboard';\n  if (pathname.startsWith('/settings') || pathname.startsWith('/fonti')) return 'fonti';\n  if (pathname.startsWith('/guida')) return 'guida';\n  if (pathname.startsWith('/onboarding')) return 'dashboard';\n  return 'dashboard';\n };\n\n const activeTab = pathnameToTab(location.pathname);",
              " const activeTab = pathnameToAppTab(location.pathname);",
              'typed pathname routing',
          )

          replace_exact(
              'src/App.tsx',
              " const tabToPath = (tab: AppTab): string => {\n  switch (tab) {\n   case 'curricolo': return '/curriculum';\n   case 'revisione': return '/curriculum';\n   case 'progetta-annuale': return '/planning';\n   case 'processo': return '/planning';\n   case 'esportazioni': return '/documents';\n   case 'certificazione-pa': return '/documents';\n   case 'second-brain': return '/knowledge';\n   case 'fonti': return '/settings';\n   case 'guida': return '/guida';\n   case 'dashboard':\n   default: return '/';\n  }\n };\n\n",
              "",
              'remove duplicated tab routing',
          )

          replace_exact(
              'src/App.tsx',
              "  navigate(tabToPath(tab));",
              "  navigate(appTabToPath(tab));",
              'typed tab navigation',
          )

          replace_exact(
              'src/features/curriculum/components/RevisioneTab.tsx',
              "import { HumanTaskSummary, evaluateRevisionHumanTask } from '../../guided-workflow';",
              "import { HumanTaskSummary, evaluateRevisionHumanTask } from '../../guided-workflow';\nimport { InstitutionalDecisionPanel, StructuredProposalStarter } from '../../beta';",
              'beta component import',
          )
          replace_exact(
              'src/features/curriculum/components/RevisioneTab.tsx',
              "  const { decisions, customTexts, activeRevisionFilter, setActiveRevisionFilter, setDecision, resetDecision, setCustomText } = useCurriculumStore();",
              "  const { decisions, customTexts, activeRevisionFilter, setActiveRevisionFilter, setDecision, resetDecision, setCustomText, discipline, order } = useCurriculumStore();",
              'store discipline/order binding',
          )
          replace_exact(
              'src/features/curriculum/components/RevisioneTab.tsx',
              "      {/* Canonical Proposals Section */}\n      <CanonicalProposalsSection />",
              "      <StructuredProposalStarter\n        proposals={currentDisciplineProps}\n        decisions={decisions}\n        customTexts={customTexts}\n        discipline={discipline}\n        order={order}\n      />\n\n      {/* Canonical Proposals Section */}\n      <CanonicalProposalsSection />",
              'structured proposal starter',
          )
          replace_exact(
              'src/features/curriculum/components/RevisioneTab.tsx',
              "              {proposal.status === 'accepted-for-decision' && (\n                <span className=\"text-[10px] text-slate-500 self-center\">\n                  In attesa di registrazione decisione — usare il pannello decisioni\n                </span>\n              )}",
              "              {proposal.status === 'accepted-for-decision' && (\n                <>\n                  <span className=\"text-[10px] text-slate-500 self-center\">\n                    In attesa di decisione istituzionale autenticata\n                  </span>\n                  {version && <InstitutionalDecisionPanel proposal={proposal} version={version} />}\n                </>\n              )}",
              'institutional decision panel',
          )
          replace_exact(
              'src/features/beta/InstitutionalDecisionPanel.tsx',
              'className="m-4 rounded-xl border-2 border-emerald-200 bg-emerald-50/40 p-4 text-xs text-slate-700 space-y-3"',
              'className="mt-2 w-full rounded-xl border-2 border-emerald-200 bg-emerald-50/40 p-4 text-xs text-slate-700 space-y-3"',
              'decision panel flex width',
          )
          PY

      - run: npm ci

      - name: B3 targeted contract tests
        run: >-
          npx vitest run
          src/__tests__/beta-revision-routing-contract.test.ts
          src/__tests__/beta-revision-version-fingerprint.test.ts
          src/__tests__/beta-shared-decision-boundary.test.ts
          src/__tests__/beta-identity-authority.test.ts

      - name: TypeScript with diagnostic capture
        id: tsc
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/b3-tsc.txt 2>&1
          code=$?
          cat /tmp/b3-tsc.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            mkdir -p docs/evidence
            cp /tmp/b3-tsc.txt docs/evidence/B3_TSC_DIAGNOSTIC.txt
          fi
          exit 0

      - name: Commit TypeScript diagnostic only
        if: steps.tsc.outputs.exit_code != '0'
        run: |
          git checkout -- src/App.tsx src/features/curriculum/components/RevisioneTab.tsx src/features/beta/InstitutionalDecisionPanel.tsx
          git config user.name 'CurManLight Beta Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/evidence/B3_TSC_DIAGNOSTIC.txt
          git commit -m 'Beta B3: update TypeScript diagnostic'
          git push origin HEAD:beta/b3-g4-revision-journey

      - name: Stop on TypeScript errors
        if: steps.tsc.outputs.exit_code != '0'
        run: exit 1

      - name: Beta build
        if: steps.tsc.outputs.exit_code == '0'
        run: npm run build:beta

      - name: Commit verified patch to branch
        if: steps.tsc.outputs.exit_code == '0'
        run: |
          rm .github/workflows/b3-apply-revision-journey-patch.yml
          rm -f docs/evidence/B3_TSC_DIAGNOSTIC.txt
          git config user.name 'CurManLight Beta Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Beta B3: bind authenticated decision to revision journey'
          git push origin HEAD:beta/b3-g4-revision-journey
