name: Deploy Arena Beta

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable commit SHA or known-good ref to deploy/rollback
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arena-beta-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CML_RELEASE_REF: ${{ inputs.ref }}
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Resolve immutable release SHA
        id: release
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fast regression tests
        run: npm run test:fast

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build Beta artifact
        env:
          CML_RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: npm run build:beta

      - name: Verify Beta release contract
        run: npm run beta:verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    timeout-minutes: 5
    env:
      BETA_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_SHA: ${{ needs.build.outputs.release_sha }}
    steps:
      - name: Verify published application
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BETA_URL"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 "${BETA_URL}" >/tmp/beta-index.html
          test -s /tmp/beta-index.html

      - name: Verify published release identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 "${BETA_URL%/}/beta-release.json" >/tmp/beta-release.json
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("/tmp/beta-release.json", "utf8"));
            if (data.releaseSha !== process.env.EXPECTED_SHA) {
              console.error(`Published SHA mismatch: expected ${process.env.EXPECTED_SHA}, got ${data.releaseSha}`);
              process.exit(1);
            }
            console.log(`BETA_PUBLISHED_SMOKE_PASS ${data.releaseSha}`);
          '

      - name: Checkout requested release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Verify public Supabase Auth reachability when configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .env.beta ]]; then
            echo "BETA_SUPABASE_AUTH_REACHABILITY_SKIP no .env.beta on requested release"
            exit 0
          fi

          VITE_SUPABASE_URL="$(sed -n 's/^VITE_SUPABASE_URL=//p' .env.beta | head -n 1)"
          if [[ -z "$VITE_SUPABASE_URL" ]]; then
            echo "BETA_SUPABASE_AUTH_REACHABILITY_SKIP no VITE_SUPABASE_URL on requested release"
            exit 0
          fi

          HTTP_STATUS="$(curl --silent --show-error --location --retry 4 --retry-delay 3 \
            --output /tmp/supabase-auth-health.json --write-out '%{http_code}' \
            "${VITE_SUPABASE_URL%/}/auth/v1/health")"

          case "$HTTP_STATUS" in
            200|401)
              echo "BETA_SUPABASE_AUTH_REACHABILITY_PASS status=${HTTP_STATUS} host=${VITE_SUPABASE_URL#https://}"
              ;;
            *)
              echo "Unexpected Supabase Auth health status: ${HTTP_STATUS}"
              exit 1
              ;;
          esac

      - name: Verify Supabase Auth CORS preflight when configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .env.beta ]]; then
            echo "BETA_SUPABASE_CORS_PREFLIGHT_SKIP no .env.beta on requested release"
            exit 0
          fi

          VITE_SUPABASE_URL="$(sed -n 's/^VITE_SUPABASE_URL=//p' .env.beta | head -n 1)"
          if [[ -z "$VITE_SUPABASE_URL" ]]; then
            echo "BETA_SUPABASE_CORS_PREFLIGHT_SKIP no VITE_SUPABASE_URL on requested release"
            exit 0
          fi

          BETA_ORIGIN="$(printf '%s' "$BETA_URL" | sed -E 's#^(https?://[^/]+).*$#\1#')"
          HTTP_STATUS="$(curl --silent --show-error --location \
            --request OPTIONS \
            --header "Origin: ${BETA_ORIGIN}" \
            --header "Access-Control-Request-Method: GET" \
            --header "Access-Control-Request-Headers: apikey" \
            --dump-header /tmp/supabase-preflight-headers.txt \
            --output /tmp/supabase-preflight-body.txt \
            --write-out '%{http_code}' \
            "${VITE_SUPABASE_URL%/}/auth/v1/settings")"

          case "$HTTP_STATUS" in
            200|204) ;;
            *)
              echo "Unexpected Supabase Auth preflight status: ${HTTP_STATUS}"
              cat /tmp/supabase-preflight-headers.txt
              exit 1
              ;;
          esac

          grep -qi '^access-control-allow-origin:' /tmp/supabase-preflight-headers.txt
          grep -qiE '^access-control-allow-headers:.*apikey' /tmp/supabase-preflight-headers.txt
          echo "BETA_SUPABASE_CORS_PREFLIGHT_PASS status=${HTTP_STATUS} origin=${BETA_ORIGIN}"
