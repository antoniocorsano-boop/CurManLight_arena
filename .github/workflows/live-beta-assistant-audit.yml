name: Live Beta Assistant Browser Audit

on:
  workflow_run:
    workflows: ["Deploy Arena Beta"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-beta-assistant:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve published release identity
        id: published-release
        shell: bash
        env:
          BETA_URL: https://antoniocorsano-boop.github.io/CurManLight_arena
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5             "${BETA_URL%/}/beta-release.json" >/tmp/beta-release.json

          DEPLOYED_RELEASE_SHA="$(node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("/tmp/beta-release.json", "utf8"));
            process.stdout.write(String(data.releaseSha || "").trim());
          ')"

          if [[ ! "$DEPLOYED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid published release SHA: ${DEPLOYED_RELEASE_SHA:-<empty>}"
            exit 1
          fi

          echo "sha=$DEPLOYED_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "LIVE_BETA_RELEASE_IDENTITY_PASS $DEPLOYED_RELEASE_SHA"

      - name: Checkout deployed release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.published-release.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Navigate published Beta
        env:
          BETA_URL: https://antoniocorsano-boop.github.io/CurManLight_arena/
          EXPECTED_RELEASE_SHA: ${{ steps.published-release.outputs.sha }}
        run: node scripts/audit-live-beta-assistant.cjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-beta-assistant-audit
          path: artifacts/live-beta-assistant/
          if-no-files-found: warn
