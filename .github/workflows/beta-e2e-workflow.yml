permissions:
  contents: read

jobs:
  revision-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: BETA-G4 revision contracts
        run: >-
          npx vitest run
          src/__tests__/revision-initial-version-reference.test.ts
          src/__tests__/beta-shared-decision-boundary.test.ts
          src/__tests__/beta-institutional-decision-boundary.test.ts
          src/__tests__/beta-explicit-decision-outcome-contract.test.ts
          src/__tests__/beta-planning-handoff-preview.test.ts
          src/__tests__/beta-revision-routing-contract.test.ts
          src/__tests__/beta-revision-version-fingerprint.test.ts
          src/__tests__/beta-router-basename-contract.test.ts
          src/__tests__/beta-identity-authority.test.ts
          src/__tests__/operational-groups.test.ts
          src/__tests__/operational-onboarding.test.ts
          src/__tests__/team-organizational-binding.test.ts
          src/__tests__/team-review-provenance.test.ts
          src/__tests__/team-review-legacy-scope-backfill.test.ts
          src/__tests__/teacher-three-level-communication.test.ts
          src/__tests__/institutional-curriculum-source-register.test.ts

      - name: BETA-G4 server authority invariants
        run: |
          set -euo pipefail
          base_file='supabase/migrations/20260827111500_b3_institutional_revision_decisions.sql'
          guard_file='supabase/migrations/20260827133000_b3_decision_sequence_guard.sql'
          acl_file='supabase/migrations/20260827114500_b3_revoke_anon_decision_rpc.sql'
          preflight_file='supabase/migrations/20260906094400_team_review_operational_scope_preflight.sql'
          scope_file='supabase/migrations/20260906094500_team_review_operational_scope.sql'
          acl201_file='supabase/migrations/20260906095500_team_review_rpc_acl_hardening.sql'
          provenance_file='supabase/migrations/20260906101500_team_review_legacy_authority_provenance.sql'

          grep -Fq 'alter table public.institutional_revision_decisions enable row level security' "$base_file"
          grep -Fq 'security definer' "$base_file"
          grep -Fq "v_role is distinct from 'collegio'" "$base_file"
          grep -Fq "raise exception 'REVISION_DECIDE_REQUIRED'" "$base_file"
          grep -Fq 'auth.uid()' "$base_file"
          grep -Fq 'membership.status = '\''active'\''' "$base_file"
          grep -Fq 'workspace.status = '\''active'\''' "$base_file"
          grep -Fq 'revoke insert, update, delete on table public.institutional_revision_decisions from anon, authenticated' "$base_file"
          grep -Fq 'grant execute on function public.record_institutional_revision_decision' "$base_file"
          grep -Fq 'proposal_version_fingerprint' "$base_file"
          grep -Fq 'unique (workspace_id, client_request_id)' "$base_file"
          grep -Fq 'institutional_revision_decisions_one_final_per_version_uidx' "$guard_file"
          grep -Fq 'pg_advisory_xact_lock' "$guard_file"
          grep -Fq "raise exception 'PROPOSAL_VERSION_FINGERPRINT_MISMATCH'" "$guard_file"
          grep -Fq "raise exception 'INSTITUTIONAL_DECISION_ALREADY_FINAL'" "$guard_file"
          grep -Fq "v_latest.outcome in ('approve', 'approve-with-changes', 'reject')" "$guard_file"
          grep -Fq "'defer', 'return-for-revision'" "$guard_file"
          grep -Fq 'revoke execute on function public.record_institutional_revision_decision' "$acl_file"
          grep -Fq ') from anon;' "$acl_file"
          grep -Fq ') to authenticated;' "$acl_file"

          grep -Fq 'create table if not exists public.team_operational_memberships' "$scope_file"
          grep -Fq 'get_team_review_eligible_contributor_count_v3' "$scope_file"
          grep -Fq 'SELF_ASSIGNED_OPERATIONAL_COORDINATOR_FORBIDDEN' "$scope_file"
          grep -Fq "v_workspace_role not in ('dipartimento','referente')" "$scope_file"
          grep -Fq 'VERIFIED_TEAM_OUTCOME_AUTHORITY_REQUIRED' "$scope_file"
          grep -Fq 'TEAM_REVIEW_COVERAGE_INCOMPLETE' "$scope_file"

          grep -Fq 'LEGACY_TECHNOLOGY_CONTRIBUTION_FINGERPRINT_MISMATCH' "$preflight_file"
          grep -Fq 'LEGACY_TECHNOLOGY_OUTCOME_FINGERPRINT_MISMATCH' "$preflight_file"
          grep -Fq 'LEGACY_TECHNOLOGY_OUTCOME_AUTHORITY_MISMATCH' "$preflight_file"
          grep -Fq 'join expected e on e.proposal_ref = c.proposal_ref' "$preflight_file"
          grep -Fq 'join expected e on e.proposal_ref = o.proposal_ref' "$preflight_file"
          grep -Fq "where proposal_ref in ('it-sec-1','it-sec-2')" "$scope_file"

          grep -Fq 'revoke all on function public.upsert_team_review_contribution_v1' "$acl201_file"
          grep -Fq 'revoke all on function public.record_team_review_outcome_v1' "$acl201_file"
          grep -Fq 'revoke all on function public.get_team_review_eligible_contributor_count_v1' "$acl201_file"
          grep -Fq 'from public, anon, authenticated' "$acl201_file"
          grep -Fq 'grant execute on function public.upsert_team_review_contribution_v2' "$acl201_file"
          grep -Fq 'grant execute on function public.get_team_review_eligible_contributor_count_v3' "$acl201_file"
          grep -Fq 'grant execute on function public.record_team_review_outcome_v2' "$acl201_file"

          grep -Fq "authority_state = 'PRE_SCOPE_LEGACY'" "$provenance_file"
          grep -Fq 'recorded_by_operational_role = null' "$provenance_file"
          grep -Fq 'v_actor_operational_role' "$provenance_file"
          grep -Fq 'operational.member_role = new.recorded_by_operational_role' "$provenance_file"
          grep -Fq "new.authority_state not in ('OPERATIVO_PROVVISORIO','FORMALIZZATO')" "$provenance_file"

          legacy_block=$(awk '/-- 4\. Deterministic continuity of known pre-scope Beta evidence/{flag=1} /-- 5\. Scoped contribution API and privacy-minimal denominator/{flag=0} flag' "$scope_file")
          if printf '%s' "$legacy_block" | grep -Fq 'insert into public.team_operational_memberships'; then
            echo 'legacy continuity must not infer operational memberships' >&2
            exit 1
          fi

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Beta production build
        run: npm run build:beta

      - name: Install Chromium for bounded browser verification
        run: npx playwright install --with-deps chromium

      - name: BETA-G4 blocked browser journey and refresh re-entry
        env:
          BETA_BASE_URL: http://127.0.0.1:4173/CurManLight_arena
        run: |
          set -euo pipefail
          node scripts/serve-beta-pages-preview.cjs > /tmp/cml-beta-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; cat /tmp/cml-beta-preview.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/CurManLight_arena/ > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/CurManLight_arena/ > /dev/null
          echo 'BETA_PAGES_DEEP_LINK_NOTE: HTTP 404 on direct SPA routes is expected in this preview because it mirrors GitHub Pages 404.html rehydration.'
          node scripts/verify-beta-g4-browser.cjs
