name: Beta E2E Workflow

on:
  pull_request:
    paths:
      - 'src/domain/revision/sharedDecisionPort.ts'
      - 'src/domain/revision/index.ts'
      - 'src/infrastructure/supabase/sharedRevisionDecisionRepository.ts'
      - 'src/infrastructure/supabase/index.ts'
      - 'src/__tests__/beta-shared-decision-boundary.test.ts'
      - 'supabase/migrations/20260827111500_b3_institutional_revision_decisions.sql'
      - 'docs/architecture/CML_ARENA_BETA_B3_ACCEPTANCE_v1.json'
      - '.github/workflows/beta-e2e-workflow.yml'
  push:
    branches: [main]
    paths:
      - 'src/domain/revision/sharedDecisionPort.ts'
      - 'src/domain/revision/index.ts'
      - 'src/infrastructure/supabase/sharedRevisionDecisionRepository.ts'
      - 'src/infrastructure/supabase/index.ts'
      - 'src/__tests__/beta-shared-decision-boundary.test.ts'
      - 'supabase/migrations/20260827111500_b3_institutional_revision_decisions.sql'
      - 'docs/architecture/CML_ARENA_BETA_B3_ACCEPTANCE_v1.json'
      - '.github/workflows/beta-e2e-workflow.yml'

permissions:
  contents: read

jobs:
  shared-decision-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: BETA-G4 shared decision contract
        run: npx vitest run src/__tests__/beta-shared-decision-boundary.test.ts
      - name: BETA-G4 server authority invariants
        run: |
          set -euo pipefail
          file='supabase/migrations/20260827111500_b3_institutional_revision_decisions.sql'
          grep -Fq 'alter table public.institutional_revision_decisions enable row level security' "$file"
          grep -Fq 'security definer' "$file"
          grep -Fq "v_role is distinct from 'collegio'" "$file"
          grep -Fq "raise exception 'REVISION_DECIDE_REQUIRED'" "$file"
          grep -Fq 'auth.uid()' "$file"
          grep -Fq 'membership.status = '\''active'\''' "$file"
          grep -Fq 'workspace.status = '\''active'\''' "$file"
          grep -Fq 'revoke insert, update, delete on table public.institutional_revision_decisions from anon, authenticated' "$file"
          grep -Fq 'grant execute on function public.record_institutional_revision_decision' "$file"
          grep -Fq 'proposal_version_fingerprint' "$file"
          grep -Fq 'unique (workspace_id, client_request_id)' "$file"
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Beta production build
        run: npm run build:beta
