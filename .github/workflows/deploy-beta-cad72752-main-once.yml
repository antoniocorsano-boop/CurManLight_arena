name: Deploy Arena Beta cad72752 Main Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-beta-cad72752-main-once.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arena-beta-pages
  cancel-in-progress: false

env:
  RELEASE_SHA: cad72752c70a90c448fd05eb16a55c1ad83bb0f1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify immutable release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$RELEASE_SHA"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "BETA_EXACT_HEAD_CHECKOUT_PASS $ACTUAL_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fast regression tests
        run: npm run test:fast

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build Beta artifact
        env:
          CML_RELEASE_REF: ${{ env.RELEASE_SHA }}
          CML_RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: npm run build:beta

      - name: Verify Beta release contract
        run: npm run beta:verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact-head artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    timeout-minutes: 5
    env:
      BETA_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_SHA: ${{ needs.build.outputs.release_sha }}
    steps:
      - name: Verify published application
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BETA_URL"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "${BETA_URL}" >/tmp/beta-index.html
          test -s /tmp/beta-index.html

      - name: Verify published release identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "${BETA_URL%/}/beta-release.json" >/tmp/beta-release.json
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("/tmp/beta-release.json", "utf8"));
            if (data.releaseSha !== process.env.EXPECTED_SHA) {
              console.error(`Published SHA mismatch: expected ${process.env.EXPECTED_SHA}, got ${data.releaseSha}`);
              process.exit(1);
            }
            console.log(`BETA_PUBLISHED_SMOKE_PASS ${data.releaseSha}`);
          '
