name: H3 H4 Authority Boundary

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260910120000_vertical_review_institutional_handoff.sql'
      - 'supabase/migrations/20260910121500_vertical_review_institutional_handoff_performance_hardening.sql'
      - 'supabase/migrations/20260910130000_h3_bound_institutional_decision.sql'
      - 'supabase/migrations/20260910130500_h3_bound_institutional_decision_performance_hardening.sql'
      - 'supabase/migrations/20260910133000_beta_development_pilot_authority.sql'
      - 'supabase/migrations/20260910134500_beta_development_pilot_authority_performance.sql'
      - 'supabase/migrations/20260910140000_h3_bound_institutional_decision_pgcrypto_schema_fix.sql'
      - 'supabase/migrations/20260910150000_h4_canonical_adoption_handoff.sql'
      - 'supabase/migrations/20260910150500_h4_canonical_adoption_handoff_performance.sql'
      - 'supabase/migrations/20260910153000_beta_development_pilot_dirigente_authority.sql'
      - 'supabase/migrations/20260910160000_h4_bound_canonical_adoption_receipt.sql'
      - 'supabase/migrations/20260910160500_h4_bound_canonical_adoption_performance.sql'
      - 'src/domain/revision/institutionalReviewHandoff.ts'
      - 'src/domain/revision/h3BoundInstitutionalDecision.ts'
      - 'src/domain/revision/h4CanonicalAdoptionHandoff.ts'
      - 'src/domain/revision/h4BoundCanonicalAdoption.ts'
      - 'src/infrastructure/supabase/institutionalReviewHandoffRepository.ts'
      - 'src/infrastructure/supabase/h3BoundInstitutionalDecisionRepository.ts'
      - 'src/infrastructure/supabase/h4CanonicalAdoptionHandoffRepository.ts'
      - 'src/infrastructure/supabase/h4BoundCanonicalAdoptionRepository.ts'
      - 'src/features/beta/H3BoundInstitutionalDecisionPanel.tsx'
      - 'src/features/beta/H4CanonicalAdoptionHandoffPanel.tsx'
      - 'src/features/beta/H4BoundCanonicalAdoptionPanel.tsx'
      - 'src/features/beta/VerticalReviewPanel.tsx'
      - 'src/__tests__/vertical-review-institutional-handoff.test.ts'
      - 'src/__tests__/h3-bound-institutional-decision.test.ts'
      - 'src/__tests__/development-pilot-h4.test.ts'
      - 'src/__tests__/h4-canonical-adoption-handoff.test.ts'
      - 'src/__tests__/h4-bound-canonical-adoption.test.ts'
      - 'vitest.fast.config.ts'
      - '.github/workflows/h3-h4-authority.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260910120000_vertical_review_institutional_handoff.sql'
      - 'supabase/migrations/20260910121500_vertical_review_institutional_handoff_performance_hardening.sql'
      - 'supabase/migrations/20260910130000_h3_bound_institutional_decision.sql'
      - 'supabase/migrations/20260910130500_h3_bound_institutional_decision_performance_hardening.sql'
      - 'supabase/migrations/20260910133000_beta_development_pilot_authority.sql'
      - 'supabase/migrations/20260910134500_beta_development_pilot_authority_performance.sql'
      - 'supabase/migrations/20260910140000_h3_bound_institutional_decision_pgcrypto_schema_fix.sql'
      - 'supabase/migrations/20260910150000_h4_canonical_adoption_handoff.sql'
      - 'supabase/migrations/20260910150500_h4_canonical_adoption_handoff_performance.sql'
      - 'supabase/migrations/20260910153000_beta_development_pilot_dirigente_authority.sql'
      - 'supabase/migrations/20260910160000_h4_bound_canonical_adoption_receipt.sql'
      - 'supabase/migrations/20260910160500_h4_bound_canonical_adoption_performance.sql'
      - 'src/domain/revision/institutionalReviewHandoff.ts'
      - 'src/domain/revision/h3BoundInstitutionalDecision.ts'
      - 'src/domain/revision/h4CanonicalAdoptionHandoff.ts'
      - 'src/domain/revision/h4BoundCanonicalAdoption.ts'
      - 'src/infrastructure/supabase/institutionalReviewHandoffRepository.ts'
      - 'src/infrastructure/supabase/h3BoundInstitutionalDecisionRepository.ts'
      - 'src/infrastructure/supabase/h4CanonicalAdoptionHandoffRepository.ts'
      - 'src/infrastructure/supabase/h4BoundCanonicalAdoptionRepository.ts'
      - 'src/features/beta/H3BoundInstitutionalDecisionPanel.tsx'
      - 'src/features/beta/H4CanonicalAdoptionHandoffPanel.tsx'
      - 'src/features/beta/H4BoundCanonicalAdoptionPanel.tsx'
      - 'src/features/beta/VerticalReviewPanel.tsx'
      - 'src/__tests__/vertical-review-institutional-handoff.test.ts'
      - 'src/__tests__/h3-bound-institutional-decision.test.ts'
      - 'src/__tests__/development-pilot-h4.test.ts'
      - 'src/__tests__/h4-canonical-adoption-handoff.test.ts'
      - 'src/__tests__/h4-bound-canonical-adoption.test.ts'
      - 'vitest.fast.config.ts'
      - '.github/workflows/h3-h4-authority.yml'

permissions:
  contents: read

jobs:
  h3-h4-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: H3, H4 and adoption boundary tests
        run: >-
          npx vitest run
          src/__tests__/vertical-review-institutional-handoff.test.ts
          src/__tests__/h3-bound-institutional-decision.test.ts
          src/__tests__/development-pilot-h4.test.ts
          src/__tests__/h4-canonical-adoption-handoff.test.ts
          src/__tests__/h4-bound-canonical-adoption.test.ts

      - name: H4 server authority invariants
        run: |
          set -euo pipefail
          h4='supabase/migrations/20260910130000_h3_bound_institutional_decision.sql'
          perf='supabase/migrations/20260910130500_h3_bound_institutional_decision_performance_hardening.sql'
          pilot='supabase/migrations/20260910133000_beta_development_pilot_authority.sql'
          pilot_perf='supabase/migrations/20260910134500_beta_development_pilot_authority_performance.sql'
          crypto_fix='supabase/migrations/20260910140000_h3_bound_institutional_decision_pgcrypto_schema_fix.sql'
          adoption_handoff='supabase/migrations/20260910150000_h4_canonical_adoption_handoff.sql'
          adoption_perf='supabase/migrations/20260910150500_h4_canonical_adoption_handoff_performance.sql'
          pilot_dirigente='supabase/migrations/20260910153000_beta_development_pilot_dirigente_authority.sql'
          adoption='supabase/migrations/20260910160000_h4_bound_canonical_adoption_receipt.sql'
          adoption_receipt_perf='supabase/migrations/20260910160500_h4_bound_canonical_adoption_performance.sql'

          grep -Fq 'record_h3_bound_institutional_decision_v1' "$h4"
          grep -Fq "v_role is distinct from 'collegio'" "$h4"
          grep -Fq 'p_expected_context_user_id <> v_user' "$h4"
          grep -Fq 'H3_HANDOFF_SNAPSHOT_MISMATCH' "$h4"
          grep -Fq 'H4_STALE_H2_SOURCE' "$h4"
          grep -Fq 'H4_H2_CONTINUATION_OPEN' "$h4"
          grep -Fq 'H4_STALE_H3' "$h4"
          grep -Fq 'CML_ARENA_H3_H4_BINDING_V1' "$h4"
          grep -Fq "decision_basis = 'VERTICAL_REVIEW_HANDOFF'" "$h4"
          grep -Fq 'revoke insert, update, delete on table public.institutional_revision_decisions' "$h4"
          grep -Fq "revoke execute on function %s from authenticated" "$h4"
          grep -Fq 'institutional_revision_decisions_vertical_handoff_fk_idx' "$perf"

          grep -Fq 'development_pilot_authority_assignments' "$pilot"
          grep -Fq "scope = 'BETA_DEVELOPMENT_PILOT'" "$pilot"
          grep -Fq 'previous_workspace_role' "$pilot"
          grep -Fq "new.authority_context := 'DEVELOPMENT_PILOT'" "$pilot"
          grep -Fq 'authority_assignment_id' "$pilot"
          grep -Fq 'revoke insert, update, delete on table public.development_pilot_authority_assignments' "$pilot"
          grep -Fq 'development_pilot_authority_assignments_user_idx' "$pilot_perf"
          grep -Fq 'development_pilot_authority_assignments(user_id)' "$pilot_perf"

          grep -Fq 'alter function public.record_h3_bound_institutional_decision_v1' "$crypto_fix"
          grep -Fq 'set search_path = public, extensions, pg_temp' "$crypto_fix"

          grep -Fq 'prepare_h4_canonical_adoption_handoff_v1' "$adoption_handoff"
          grep -Fq "v_decision.decision_basis <> 'VERTICAL_REVIEW_HANDOFF'" "$adoption_handoff"
          grep -Fq "v_decision.outcome not in ('approve','approve-with-changes')" "$adoption_handoff"
          grep -Fq 'CURRENT_FINAL_H4_DECISION_REQUIRED' "$adoption_handoff"
          grep -Fq 'ADOPTION_HANDOFF_STALE_H2_SOURCE' "$adoption_handoff"
          grep -Fq 'ADOPTION_HANDOFF_STALE_H3' "$adoption_handoff"
          grep -Fq 'CML_ARENA_H4_ADOPTION_HANDOFF_V1' "$adoption_handoff"
          grep -Fq 'extensions.digest' "$adoption_handoff"
          grep -Fq 'adoption_receipt_created boolean not null default false' "$adoption_handoff"
          grep -Fq 'curriculum_in_force_changed boolean not null default false' "$adoption_handoff"
          grep -Fq 'automatic_master_promotion boolean not null default false' "$adoption_handoff"
          grep -Fq 'h4_canonical_adoption_handoffs_decision_idx' "$adoption_perf"

          grep -Fq "authority_role in ('collegio','dirigente')" "$pilot_dirigente"
          grep -Fq 'unique (workspace_id, user_id, scope, authority_role)' "$pilot_dirigente"
          grep -Fq 'development_pilot_authority_assignments_role_active_idx' "$pilot_dirigente"

          grep -Fq 'record_h4_bound_canonical_adoption_v1' "$adoption"
          grep -Fq "assignment.authority_role = 'dirigente'" "$adoption"
          grep -Fq "v_membership_role is distinct from 'dirigente'" "$adoption"
          grep -Fq "status text not null default 'ADOPTED_PENDING_MATERIALIZATION'" "$adoption"
          grep -Fq 'ADOPTION_CURRENT_FINAL_H4_REQUIRED' "$adoption"
          grep -Fq 'ADOPTION_STALE_H2_SOURCE' "$adoption"
          grep -Fq 'ADOPTION_H2_CONTINUATION_OPEN' "$adoption"
          grep -Fq 'ADOPTION_STALE_H3' "$adoption"
          grep -Fq 'CML_ARENA_H4_BOUND_ADOPTION_V1' "$adoption"
          grep -Fq 'extensions.digest' "$adoption"
          grep -Fq 'revoke insert, update, delete on table public.h4_bound_canonical_adoption_receipts' "$adoption"
          grep -Fq 'materialization_created boolean not null default false' "$adoption"
          grep -Fq 'curriculum_in_force_changed boolean not null default false' "$adoption"
          grep -Fq 'automatic_master_promotion boolean not null default false' "$adoption"
          grep -Fq 'h4_bound_canonical_adoption_handoff_fk_idx' "$adoption_receipt_perf"

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Beta build
        run: npm run build:beta
