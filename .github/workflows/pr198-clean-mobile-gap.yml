name: PR198 Team Identity Navigation Fix

on:
  push:
    branches:
      - ops/pr198-preview-build

permissions:
  contents: write

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: feature/team-meeting-workspace
          fetch-depth: 0

      - name: Use router navigation for team identity entry
        run: |
          python - <<'PY'
          from pathlib import Path

          team = Path('src/features/beta/TeamReviewWorkspace.tsx')
          text = team.read_text()

          react_import = "import { useEffect, useMemo, useState } from 'react';\n"
          link_import = "import { Link } from 'react-router-dom';\n"
          if link_import not in text:
              if react_import not in text:
                  raise SystemExit('React import anchor not found')
              text = text.replace(react_import, react_import + link_import, 1)

          text = text.replace("import { resolveRouterBasename } from '../navigation/routerBasename';\n", "")
          text = text.replace("  const routerBasename = resolveRouterBasename(import.meta.env.MODE).replace(/\\/$/, '');\n  const identityHref = `${routerBasename}/beta-identity`;\n\n", "")

          old = '<a href={identityHref} className="font-bold underline">accedi</a>'
          new = '<Link to="/beta-identity" className="font-bold underline">accedi</Link>'
          if old not in text and new not in text:
              raise SystemExit('Expected team identity anchor not found')
          text = text.replace(old, new, 1)
          team.write_text(text)

          test = Path('src/__tests__/team-review-identity-navigation.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';
import { readFileSync } from 'node:fs';

const teamSource = readFileSync('src/features/beta/TeamReviewWorkspace.tsx', 'utf8');
const mainSource = readFileSync('src/main.tsx', 'utf8');

describe('team review identity navigation', () => {
  it('uses client-side routing for the Beta identity entry', () => {
    expect(teamSource).toContain("import { Link } from 'react-router-dom';");
    expect(teamSource).toContain('<Link to="/beta-identity"');
    expect(teamSource).not.toContain('href={identityHref}');
    expect(teamSource).not.toContain('resolveRouterBasename');
  });

  it('keeps the identity page as an explicit application route', () => {
    expect(mainSource).toContain('<Route path="/beta-identity" element={<BetaIdentityPage />} />');
  });
});
""")
          PY

          grep -F 'Link to="/beta-identity"' src/features/beta/TeamReviewWorkspace.tsx
          ! grep -F 'href={identityHref}' src/features/beta/TeamReviewWorkspace.tsx
          ! grep -F 'resolveRouterBasename' src/features/beta/TeamReviewWorkspace.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Identity navigation and authority tests
        run: npx vitest run src/__tests__/team-review-identity-navigation.test.ts src/__tests__/team-review-workspace.test.ts src/__tests__/beta-router-basename-contract.test.ts src/__tests__/beta-identity-authority.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Beta build
        run: npm run build:beta

      - name: Commit validated navigation fix to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Antonio Corsano"
          git config user.email "antonio.corsano@gmail.com"
          git add src/features/beta/TeamReviewWorkspace.tsx src/__tests__/team-review-identity-navigation.test.ts
          git commit -m "fix: keep team identity navigation inside Arena"
          git push origin HEAD:feature/team-meeting-workspace
