name: Apply PR198 Storage Coherence Fix

on:
  push:
    branches:
      - ops/pr198-storage-coherence-fix

permissions:
  contents: write

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current PR #198 branch
        uses: actions/checkout@v4
        with:
          ref: feature/team-meeting-workspace
          fetch-depth: 0

      - name: Align onboarding detection with IndexedDB authority
        shell: python
        run: |
          from pathlib import Path

          store = Path('src/store/useCurriculumStore.ts')
          text = store.read_text(encoding='utf-8')

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              """const getCurriculumBaselineData = () => {\n  if (typeof window !== 'undefined') {\n    const saved = localStorage.getItem('curmanlight-custom-curriculum-v2');\n    if (saved) {\n      try {\n        return JSON.parse(saved);\n      } catch (e) {\n        // Fallback\n      }\n    }\n  }\n  return getCurriculumBaseline();\n};""",
              """const getCurriculumBaselineData = () => {\n  if (typeof window !== 'undefined') {\n    try {\n      const saved = localStorage.getItem('curmanlight-custom-curriculum-v2');\n      if (saved) {\n        try {\n          return JSON.parse(saved);\n        } catch {\n          // Invalid override: fall back to the bundled baseline.\n        }\n      }\n    } catch (error) {\n      console.warn('[CurManLight Storage Guard] Lettura curriculum personalizzato da localStorage non disponibile:', error);\n    }\n  }\n  return getCurriculumBaseline();\n};""",
              'guard local curriculum read',
          )

          text = replace_once(
              text,
              """const indexedDBStorage = {\n  getItem: async (name: string): Promise<string | null> => {""",
              """export const CURRICULUM_STATE_STORAGE_KEY = 'curmanlight-react-db-state-v1.4.0';\n\nconst indexedDBStorage = {\n  getItem: async (name: string): Promise<string | null> => {""",
              'define canonical state key',
          )

          marker = """};\n\ntype CurriculumStoreState = UserState & {"""
          replacement = """};\n\nexport async function hasPersistedCurriculumState(): Promise<boolean> {\n  return (await indexedDBStorage.getItem(CURRICULUM_STATE_STORAGE_KEY)) !== null;\n}\n\ntype CurriculumStoreState = UserState & {"""
          text = replace_once(text, marker, replacement, 'expose IndexedDB state presence')

          text = replace_once(
              text,
              """      name: 'curmanlight-react-db-state-v1.4.0',\n      storage: createJSONStorage(() => indexedDBStorage),""",
              """      name: CURRICULUM_STATE_STORAGE_KEY,\n      storage: createJSONStorage(() => indexedDBStorage),""",
              'reuse canonical state key',
          )

          store.write_text(text, encoding='utf-8')

          startup = Path('src/features/session/hooks/useAppStartupEffects.ts')
          text = startup.read_text(encoding='utf-8')

          text = replace_once(
              text,
              """import { safeLocalStorageGetItem, safeLocalStorageSetItem } from '../../../lib/consolidatedStorage';\nimport { ARENA_STORAGE_VOLATILE_EVENT, verifyBrowserStorage } from '../../../lib/storageRuntimeHealth';""",
              """import { safeLocalStorageSetItem } from '../../../lib/consolidatedStorage';\nimport { ARENA_STORAGE_VOLATILE_EVENT, verifyBrowserStorage } from '../../../lib/storageRuntimeHealth';\nimport { hasPersistedCurriculumState } from '../../../store/useCurriculumStore';""",
              'startup imports',
          )

          text = replace_once(
              text,
              """ useEffect(() => {\n  let onboardingTimer: ReturnType<typeof setTimeout> | null = null;""",
              """ useEffect(() => {\n  let onboardingTimer: ReturnType<typeof setTimeout> | null = null;\n  let disposed = false;""",
              'startup disposed guard',
          )

          old_onboarding = """  const isNew = !safeLocalStorageGetItem('curmanlight-react-db-state-v1.4.0', '');\n  if (isNew) {\n   onboardingTimer = setTimeout(() => {\n    onboardingTimer = null;\n    setOnboardingRoleLocal(role);\n    setOnboardingDiscLocal(discipline);\n    setOnboardingOrdLocal(order);\n    setShowOnboardingModal(true);\n   }, 1000);\n  }"""
          new_onboarding = """  void hasPersistedCurriculumState()\n   .then((hasPersistedState) => {\n    if (disposed || hasPersistedState) return;\n    onboardingTimer = setTimeout(() => {\n     onboardingTimer = null;\n     if (disposed) return;\n     setOnboardingRoleLocal(role);\n     setOnboardingDiscLocal(discipline);\n     setOnboardingOrdLocal(order);\n     setShowOnboardingModal(true);\n    }, 1000);\n   })\n   .catch((error) => {\n    if (disposed) return;\n    setIsDatabaseVolatile(true);\n    console.error('[CurManLight Storage Guard] Impossibile determinare la presenza dello stato persistito in IndexedDB.', error);\n   });"""
          text = replace_once(text, old_onboarding, new_onboarding, 'IndexedDB onboarding authority')

          text = replace_once(
              text,
              """  return () => {\n   cancelPendingOnboarding();""",
              """  return () => {\n   disposed = true;\n   cancelPendingOnboarding();""",
              'cleanup disposed guard',
          )

          startup.write_text(text, encoding='utf-8')

      - name: Add browser proof for persisted-state authority
        shell: bash
        run: |
          cat > src/__tests__/persisted-curriculum-state.browser.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import {
            CURRICULUM_STATE_STORAGE_KEY,
            hasPersistedCurriculumState,
            useCurriculumStore,
          } from '../store/useCurriculumStore';

          describe('persisted curriculum state authority', () => {
            it('detects the Zustand state in IndexedDB rather than localStorage', async () => {
              await useCurriculumStore.persist.clearStorage();
              localStorage.removeItem(CURRICULUM_STATE_STORAGE_KEY);
              expect(await hasPersistedCurriculumState()).toBe(false);

              useCurriculumStore.getState().setSchoolYear('2026/2027');
              await new Promise((resolve) => setTimeout(resolve, 50));

              expect(localStorage.getItem(CURRICULUM_STATE_STORAGE_KEY)).toBeNull();
              expect(await hasPersistedCurriculumState()).toBe(true);

              await useCurriculumStore.persist.clearStorage();
            });
          });
          EOF

      - name: Check patch
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Storage unit tests
        run: npx vitest run src/__tests__/storage-runtime-health.test.ts

      - name: Browser persistence tests
        run: npm run test:browser

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Push only validated fix to PR #198
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useCurriculumStore.ts src/features/session/hooks/useAppStartupEffects.ts src/__tests__/persisted-curriculum-state.browser.test.ts
          git commit -m "fix(storage): align onboarding with IndexedDB authority"
          git push origin HEAD:feature/team-meeting-workspace
