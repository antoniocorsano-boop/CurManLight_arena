name: PR198 Storage Validation

on:
  push:
    branches:
      - ops/pr198-storage-validation

permissions:
  contents: read

jobs:
  storage-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR #198 head
        uses: actions/checkout@v4
        with:
          ref: 9e323f5f8a82436d51c7dd75c54a6ca74c085288
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Storage contract tests
        run: npx vitest run src/__tests__/storage-runtime-health.test.ts

      - name: IndexedDB browser tests
        run: npm run test:browser

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
