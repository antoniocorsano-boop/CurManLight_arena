name: PR198 Preview Build

on:
  push:
    branches:
      - ops/pr198-preview-build

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact validated PR #198 SHA
        uses: actions/checkout@v4
        with:
          ref: 94e77d436adccf30f9192bfb6f94bbca34fa4997
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build exact Beta artifact
        env:
          CML_RELEASE_REF: 94e77d436adccf30f9192bfb6f94bbca34fa4997
          CML_RELEASE_SHA: 94e77d436adccf30f9192bfb6f94bbca34fa4997
        run: npm run build:beta

      - name: Verify release identity
        run: |
          node -e "const fs=require('fs');const p='dist/beta-release.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));if(d.releaseSha!=='94e77d436adccf30f9192bfb6f94bbca34fa4997'){throw new Error('Unexpected release SHA: '+d.releaseSha)}"

      - name: Upload preview dist
        uses: actions/upload-artifact@v4
        with:
          name: pr198-preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact static preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PR #198 preview 94e77d436adccf30f9192bfb6f94bbca34fa4997"
          git branch -M preview/pr198-static
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/preview/pr198-static
