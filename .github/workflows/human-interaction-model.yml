name: Human Interaction Model

on:
  pull_request:
    paths:
      - '.human/**'
      - 'tools/human-interaction-model/**'
      - 'agent_skills/human-interaction-model/**'
      - 'src/features/guided-workflow/humanTask.ts'
      - 'src/App.tsx'
      - 'src/features/navigation/**'
      - 'src/features/curriculum/**'
      - 'src/features/progettazione/**'
      - 'src/features/documents/components/EsportazioniTab.tsx'
      - 'src/features/documents/components/SecondBrainTab.tsx'
      - 'src/features/documents/components/KnowledgeModals.tsx'
      - 'src/features/documents/components/AddKnowledgeSourceModal.tsx'
      - 'src/features/documents/hooks/useKnowledgeBaseHandlers.ts'
      - 'src/features/documents/lib/**'
      - 'src/__tests__/knowledge-experience-shell.test.ts'
      - 'scripts/audit-kx-mobile.cjs'
      - 'src/features/beta/**'
      - 'src/domain/revision/**'
      - 'src/domain/transfer/**'
      - 'scripts/audit-s3-critical-journeys.cjs'
      - 'scripts/verify-beta-g4-browser.cjs'
      - 'docs/evidence/BETA_G5_HUMAN_ACCEPTANCE_PROTOCOL_v2.md'
      - 'docs/evidence/BETA_G5_HUMAN_ACCEPTANCE_RECEIPT_TEMPLATE_v2.json'
      - 'src/__tests__/arena-s3-human-validation-contract.test.ts'
      - '.github/workflows/s3-critical-journey-browser.yml'
      - '.github/workflows/human-interaction-model.yml'
  workflow_dispatch:

jobs:
  validate-him:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HIM installation
        run: node tools/human-interaction-model/validate.mjs .
