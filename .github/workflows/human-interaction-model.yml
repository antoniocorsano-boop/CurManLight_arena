name: Human Interaction Model

on:
  pull_request:
    paths:
      - '.human/**'
      - 'tools/human-interaction-model/**'
      - 'tools/human-communication-model/**'
      - 'agent_skills/human-interaction-model/**'
      - 'agent_skills/human-communication-model/**'
      - 'src/features/guided-workflow/humanTask.ts'
      - 'src/domain/human-communication/**'
      - 'src/__tests__/human-communication-model.test.ts'
      - '.github/workflows/human-interaction-model.yml'
  workflow_dispatch:

jobs:
  validate-human-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HIM installation
        run: node tools/human-interaction-model/validate.mjs .
      - name: Validate HCM installation
        run: node tools/human-communication-model/validate.mjs .
      - name: Prove portable HCM initialization
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          node tools/human-communication-model/init.mjs "$target"
          test -f "$target/.human/hcm.config.json"
          node tools/human-communication-model/validate.mjs "$target"
          echo "HUMAN_COMMUNICATION_PORTABILITY_PASS"
