name: Human Interaction Model

on:
  pull_request:
    paths:
      - '.human/**'
      - 'tools/human-interaction-model/**'
      - 'agent_skills/human-interaction-model/**'
      - 'src/features/guided-workflow/humanTask.ts'
      - '.github/workflows/human-interaction-model.yml'
  workflow_dispatch:

jobs:
  validate-him:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HIM installation
        run: node tools/human-interaction-model/validate.mjs .
