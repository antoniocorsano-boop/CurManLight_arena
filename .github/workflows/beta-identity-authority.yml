name: Beta Identity Authority

on:
  pull_request:
    paths:
      - 'src/domain/institution/**'
      - 'src/infrastructure/supabase/**'
      - 'src/__tests__/beta-identity-authority.test.ts'
      - 'supabase/migrations/**'
      - 'docs/architecture/CML_ARENA_BETA_B2_ACCEPTANCE_v1.json'
      - '.github/workflows/beta-identity-authority.yml'
      - 'vitest.fast.config.ts'
  push:
    branches: [main]
    paths:
      - 'src/domain/institution/**'
      - 'src/infrastructure/supabase/**'
      - 'src/__tests__/beta-identity-authority.test.ts'
      - 'supabase/migrations/**'
      - 'docs/architecture/CML_ARENA_BETA_B2_ACCEPTANCE_v1.json'
      - '.github/workflows/beta-identity-authority.yml'
      - 'vitest.fast.config.ts'

permissions:
  contents: read

jobs:
  identity-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: BETA-G3 contract tests
        run: npx vitest run src/__tests__/beta-identity-authority.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
