name: Beta Identity Authority

on:
  pull_request:
    paths:
      - 'src/domain/institution/**'
      - 'src/infrastructure/supabase/**'
      - 'src/features/beta/**'
      - 'src/main.tsx'
      - 'src/__tests__/beta-identity-authority.test.ts'
      - 'supabase/migrations/**'
      - 'docs/architecture/CML_ARENA_BETA_B2_ACCEPTANCE_v1.json'
      - '.github/workflows/beta-identity-authority.yml'
      - 'vitest.fast.config.ts'
      - '.env.beta'
  push:
    branches: [main]
    paths:
      - 'src/domain/institution/**'
      - 'src/infrastructure/supabase/**'
      - 'src/features/beta/**'
      - 'src/main.tsx'
      - 'src/__tests__/beta-identity-authority.test.ts'
      - 'supabase/migrations/**'
      - 'docs/architecture/CML_ARENA_BETA_B2_ACCEPTANCE_v1.json'
      - '.github/workflows/beta-identity-authority.yml'
      - 'vitest.fast.config.ts'
      - '.env.beta'

permissions:
  contents: read

jobs:
  identity-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: BETA-G3 contract tests
        run: npx vitest run src/__tests__/beta-identity-authority.test.ts
      - name: BETA-G3 RLS invariants
        run: |
          set -euo pipefail
          file='supabase/migrations/20260824070000_h2b_workspace_foundation.sql'
          grep -Fq 'alter table public.workspaces enable row level security' "$file"
          grep -Fq 'alter table public.workspace_memberships enable row level security' "$file"
          grep -Fq 'auth.uid() = user_id' "$file"
          grep -Fq "membership.status = 'active'" "$file"
          if grep -Eiq 'for[[:space:]]+(insert|update|delete)' "$file"; then
            echo 'Unexpected client-side mutation policy in BETA-G3 foundation'
            exit 1
          fi
      - name: BETA-G3 canonical Beta Supabase config
        run: |
          set -euo pipefail
          grep -Fq 'VITE_SUPABASE_URL=https://ysgaokenrutmgzkhcxvy.supabase.co' .env.beta
          grep -Eq '^VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_' .env.beta
          if grep -Eiq 'service[_-]?role|secret' .env.beta; then
            echo 'Secret or service-role material must not be present in .env.beta'
            exit 1
          fi
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Beta build
        run: npm run build:beta
