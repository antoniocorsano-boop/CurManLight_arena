name: H2B Install Supabase Client

on:
  push:
    branches: [feat/arena-h2b-supabase-adapter-foundation]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arena-h2b-supabase-adapter-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install official Supabase client
        run: npm install @supabase/supabase-js --save
      - name: Commit lockfile
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "curmanlight-automation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(h2b): add Supabase browser client"
          git push
