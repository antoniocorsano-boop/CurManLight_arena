name: Dependency Remediation Candidate

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-remediation-candidate.yml'

permissions:
  contents: write

jobs:
  apply-validated-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/dependency-remediation-2026-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate minimal remediation
        run: |
          set -euo pipefail
          npm uninstall surge --ignore-scripts
          npm pkg set overrides.nanoid=3.3.18
          npm pkg set overrides.valibot=1.4.2
          npm install --ignore-scripts

      - name: Enforce zero runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=low

      - name: Enforce zero full-graph vulnerabilities
        run: npm audit --audit-level=low

      - name: Fast tests
        run: npm run test:fast

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Beta production build
        run: npm run build:beta

      - name: Storybook build
        run: npm run build-storybook

      - name: Commit validated package remediation and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dependency-remediation-candidate.yml
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m 'Security: remove vulnerable deploy CLI and pin patched transitives'
          git push origin HEAD:${{ github.head_ref }}
